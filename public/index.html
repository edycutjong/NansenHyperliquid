<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hyperliquid perpetual copytrading dashboard — discover and track top traders via Nansen API">
  <title>NansenHyperliquid — Copytrade Tracker</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2350d2c1'/><stop offset='1' stop-color='%231fa67d'/></linearGradient></defs><path d='M50 10 L65 45 H85 L70 65 L78 95 L50 75 L22 95 L30 65 L15 45 H35Z' fill='url(%23g)'/></svg>">
</head>
<body>
  <!-- Animated background mesh -->
  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-mesh__orb bg-mesh__orb--1"></div>
    <div class="bg-mesh__orb bg-mesh__orb--2"></div>
    <div class="bg-mesh__orb bg-mesh__orb--3"></div>
  </div>

  <header class="header">
    <div class="header__icon">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <defs>
          <linearGradient id="bolt-grad" x1="0" y1="0" x2="52" y2="52">
            <stop offset="0%" stop-color="#50d2c1"/>
            <stop offset="100%" stop-color="#1fa67d"/>
          </linearGradient>
          <filter id="bolt-glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M30 4L12 28h12L20 48l20-26H28L34 4h-4z" fill="url(#bolt-grad)" filter="url(#bolt-glow)" opacity="0.95"/>
      </svg>
    </div>
    <h1 class="header__title">Hyperliquid Copytrade Tracker</h1>
    <p class="header__subtitle">Autonomous monitoring of top perpetual traders — powered by Nansen</p>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat">
      <span class="stat__dot stat__dot--off" id="daemonDot"></span>
      <span id="daemonStatus">Waiting for data...</span>
    </div>
    <div class="stat">
      <svg class="stat__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span id="traderCount">0</span>&nbsp;traders
    </div>
    <div class="stat">
      <svg class="stat__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      <span id="positionCount">0</span>&nbsp;positions
    </div>
    <div class="stat">
      <svg class="stat__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="alertCount">0</span>&nbsp;alerts
    </div>
  </div>

  <nav class="tabs">
    <button class="tab tab--active" data-tab="traders" id="tabTraders">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Traders
    </button>
    <button class="tab" data-tab="alerts" id="tabAlerts">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Alerts
    </button>
  </nav>

  <main class="container">
    <div id="tradersView" class="trader-grid"></div>
    <div id="alertsView" class="alerts-feed" style="display:none"></div>
  </main>

  <footer class="footer">
    <div class="footer__brand">
      <svg width="16" height="16" viewBox="0 0 52 52" fill="none"><path d="M30 4L12 28h12L20 48l20-26H28L34 4h-4z" fill="#50d2c1" opacity="0.6"/></svg>
      NansenHyperliquid
    </div>
    <div>Built by <a href="https://github.com/edycutjong" target="_blank">@edycutjong</a> · Powered by <a href="https://nansen.ai" target="_blank">Nansen API</a> · Hyperliquid Perp Data</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
